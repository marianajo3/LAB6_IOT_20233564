// Solo se resuelve el plugin de Google al pedir la variante conectada.
buildscript {
    ext {
        agp_version = '9.1.1'
    }
    repositories { google(); mavenCentral() }
    dependencies { if (project.findProperty('firebase') == 'true') classpath 'com.google.gms:google-services:4.4.4' }
}
plugins { id 'com.android.application' version '9.1.1' apply false }
