plugins { id 'com.android.application' }
def cloud = project.findProperty('firebase') == 'true'
if (cloud && file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'
android {
    namespace 'pe.lab6.ecohuerto'
    compileSdk 37
    defaultConfig {
        applicationId 'pe.lab6.ecohuerto'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'boolean', 'CLOUD', cloud.toString()
        resValue 'string', 'app_name', 'EcoHuerto'
    }
    sourceSets { main { java.srcDirs += cloud ? 'src/firebase/java' : 'src/demo/java'; if(cloud) manifest.srcFile 'src/firebase/AndroidManifest.xml' } }
    buildFeatures { buildConfig true; resValues true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    if (cloud) {
        implementation platform('com.google.firebase:firebase-bom:34.8.0')
        implementation 'com.google.firebase:firebase-auth'
        implementation 'com.google.firebase:firebase-firestore'
        implementation 'androidx.credentials:credentials:1.5.0'
        implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
        implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
        implementation 'com.facebook.android:facebook-login:18.1.3'
    }
}
